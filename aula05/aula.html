<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <h1>Escola Virtual</h1>
  <h2>Formulário de Pré-Matrícula</h2>

  <form action="" method="post">

    <fieldset>
      <legend><strong>Dados Pessoais</strong></legend>

      <div class="campo-grupo">
        <div class="campo">
          <label for="nome_aluno">Nome do Aluno</label>
          <input type="text" id="nome_aluno" name="nome_aluno" required>
        </div>
        <div class="campo">
          <label for="email">E-Mail</label>
          <input type="email" id="email" name="email">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="nome_mae">Nome da Mãe</label>
          <input type="text" id="nome_mae" name="nome_mae">
        </div>
        <div class="campo">
          <label for="nome_pai">Nome do Pai</label>
          <input type="text" id="nome_pai" name="nome_pai">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="nascimento">Nascimento</label>
          <input type="date" id="nascimento" name="nascimento">
        </div>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" maxlength="15" placeholder="(61) 9 9999-9999">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" maxlength="11" placeholder="000.000.000-00">
        </div>
        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="matricula">Matrícula</label>
          <input type="text" id="matricula" name="matricula" maxlength="11" placeholder="000.000.000-00">
        </div>
        <div class="campo">
          <label for="idade">Idade</label>
          <input type="text" id="idade" name="idade" readonly>
        </div>
      </div>

      <div class="campo-grupo">

        <div class="campo">
          <strong>Estado</strong>
          <select id="estado" name="estado">

          </select>
        </div>
        <div class="campo">
          <label for="cidades">Cidade</label>
          <select id="cidade" name="cidade">
            <option value=""></option>
          </select>
        </div>

    </fieldset>

    <fieldset>
      <legend><strong>Informações de Matrícula</strong></legend>

      <table>
        <tr valign="top">
          <td>
            <strong>Série</strong>
            <select id="serie" name="serie">
              <option value="pre-escolar">Pré-escolar</option>
              <option value="1ano">1º ano</option>
              <option value="2ano">2º ano</option>
              <option value="3ano">3º ano</option>
              <option value="4ano">4º ano</option>
              <option value="5ano">5º ano</option>
            </select>

            <div class="segunda-lingua">
              <strong>SEGUNDA LÍNGUA</strong>

              <label class="opcao">
                <input type="radio" name="lingua" value="ingles">
                <span class="sigla">US</span>
                <span>Inglês</span>
              </label>

              <label class="opcao">
                <input type="radio" name="lingua" value="espanhol">
                <span class="sigla">ES</span>
                <span>Espanhol</span>
              </label>
            </div>


          </td>

          <td>
            <strong>Turno</strong>
            <input type="radio" name="turno" id="manha" value="manha">
            <label for="manha">Manhã</label><br>
            <input type="radio" name="turno" id="tarde" value="tarde">
            <label for="tarde">Tarde</label>
          </td>

          <td>
            <strong>Atividades Extracurriculares</strong>
            <input type="checkbox" name="atividades" id="informatica" value="informatica">
            <label for="informatica">Informática</label><br>

            <input type="checkbox" name="atividades" id="musica" value="musica">
            <label for="musica">Música</label><br>

            <input type="checkbox" name="atividades" id="balet" value="balet">
            <label for="balet">Balet</label><br>

            <input type="checkbox" name="atividades" id="pintura" value="pintura">
            <label for="pintura">Pintura</label><br>

            <input type="checkbox" name="atividades" id="judo" value="judo">
            <label for="judo">Judô</label><br>

            <input type="checkbox" name="atividades" id="futebol" value="futebol">
            <label for="futebol">Futebol</label>
          </td>
        </tr>
      </table>
    </fieldset>

    <fieldset>
      <legend><strong>Endereço</strong></legend>

      <div class="campo-grupo">
        <div class="campo">
          <label for="logradouro">Logradouro</label>
          <input type="text" id="logradouro" name="logradouro">
        </div>

        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" name="numero" placeholder="Ex: 123">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco...">
        </div>

        <div class="campo">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro">
        </div>
      </div>

      <div class="campo-grupo-3">
        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade">
        </div>

        <div class="campo">
          <label for="estado">Estado</label>
          <input type="text" id="estado" name="estado" maxlength="2">
        </div>

        <div class="campo">
          <label for="ibge">IBGE</label>
          <input type="text" id="ibge" name="ibge">
        </div>
      </div>
    </fieldset>

    <div class="botoes">
      <input type="submit" value="Enviar Formulário">
      <input type="reset" value="Limpar Campos">
    </div>

  </form>

</body>

<script>
  const campoCep = document.getElementById('cep');
  const campoCpf = document.getElementById('cpf');
  const campoNascimento = document.getElementById('nascimento');
  const campoIdade = document.getElementById('idade');

  campoCep.addEventListener('input', function () {
    let valor = this.value.replace(/\D/g, '');

    if (valor.length > 5) {
      valor = valor.slice(0, 5) + '-' + valor.slice(5);
    }

    this.value = valor;
  });

  campoCpf.addEventListener('input', function () {
    let valor = this.value.replace(/\D/g, '');

    if (valor.length === 11) {
      valor = valor.slice(0, 3) + '.' + valor.slice(3, 6) + '.' + valor.slice(6, 9) + '-' + valor.slice(9)
    }

    this.value = valor;
  });


  campoNascimento.addEventListener('change', function () {

    const nascimento = new Date(this.value);
    const hoje = new Date();

    let idade = hoje.getFullYear() - nascimento.getFullYear();

    campoIdade.value = idade + " anos";
  });

  const urlEstados = 'https://servicodados.ibge.gov.br/api/v1/localidades/estados';
  const estadosHTML = document.getElementById("estado");
  const cidadesHTML = document.getElementById("cidade");

  window.addEventListener('load', async function () {

    const request = await fetch(urlEstados);
    const response = await request.json();

    const options = document.createElement("optgroup");
    options.setAttribute('label', 'Selecione o estado')

    response.forEach(function (estadosHTML) {
      options.innerHTML += '<option value="' + estadosHTML.sigla + '">' + estadosHTML.nome + '</option>';
    });

    estadosHTML.append(options);

  });

  estadosHTML.addEventListener('change', async function () {

    const urlCidades = 'https://servicodados.ibge.gov.br/api/v1/localidades/estados/' + estadosHTML.value + '/municipios';
    const request = await fetch(urlCidades);
    const response = await request.json();
    var options = '';

    response.forEach(function (cidadesHTML) {
      options += '<option>' + cidadesHTML.nome + '</option>';
    });

    cidadesHTML.innerHTML = options;

  });


</script>

</html>
