<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>Escolha Virtual</h1>

        <input type="text" name="" id="">

        <input type="number" name="" id="">

        <input type="number" name="" id="">

        <input type="number" name="" id="">

    <fieldset>
        <h2>Informações do Matricula</h2>
        <h3>Série</h3>

        <label for="">Informatica</label>

        <label for="">Música</label>
        <input type="checkbox">
        <label for="">Balet</label>

        <label for="">Pintura</label>
        <input type="checkbox">
        <label for="">Judô</label>
        <input type="checkbox">
        <label for="">Futebol</label>
    </fieldset>
    <button type="button">Envia Formulario</button>
    <button type="button">Limpa Campos</button>

</html>
