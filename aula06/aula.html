<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-3">
        <h2>Inscrição / Contato</h2>
        <p class="text-secondary">Preencha os campos abaixo. Campos marcados com * são obrigatórios.</p>

        <form>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="nome" placeholder="João" required>
                </div>

                <div class="col-md-6">
                    <label for="sobrenome" class="form-label">Sobrenome <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="sobrenome" placeholder="Silva" required>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                </div>

                <div class="col-md-6">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="telefone" placeholder="(11) 91234-5678">
                </div>

                <div class="col-md-6">
                    <label for="cpf" class="form-label">CPF <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="col-md-6">
                    <label for="nascimento" class="form-label">Data de nascimento</label>
                    <input type="date" class="form-control" id="nascimento">
                </div>

                <div class="col-md-6">
                    <label for="senha" class="form-label">Senha <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>

                <div class="col-md-6">
                    <label for="funcao" class="form-label">Função</label>
                    <select class="form-select" id="funcao">
                        <option selected>Escolha...</option>
                        <option>Aluno</option>
                        <option>Professor</option>
                        <option>Funcionário</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="usuario" class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="text" class="form-control" id="usuario" placeholder="nomeusuario">
                    </div>
                </div>

                <div class="col-12">
                    <label for="mensagem" class="form-label">Mensagem</label>
                    <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva aqui..."></textarea>
                </div>

                <div class="col-12">
                    <label for="curriculo" class="form-label">Upload de Currículo (PDF)</label>
                    <input class="form-control" type="file" id="curriculo" accept=".pdf">
                    <div class="form-text">Máx. 5MB. Apenas PDF.</div>
                </div>

                <div class="col-12">
                    <div class="d-flex flex-wrap gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="novidades">
                            <label class="form-check-label" for="novidades">
                                Quero receber novidades
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="contato" id="emailContato" checked>
                            <label class="form-check-label" for="emailContato">
                                Contato por email
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="contato" id="telefoneContato">
                            <label class="form-check-label" for="telefoneContato">
                                Contato por telefone
                            </label>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                    <button type="reset" class="btn btn-outline-secondary ms-2">Limpar</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
